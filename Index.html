<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sikka Cafe | سكة كافيه</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0f172a; color: #f8fafc; transition: background-color 0.3s, color 0.3s; }
        body.light-mode { background-color: #f8fafc; color: #0f172a; }
        body.light-mode header { background-color: rgba(255, 255, 255, 0.9) !important; border-color: #e2e8f0 !important; }
        body.light-mode .card-bg { background-color: #ffffff !important; border-color: #e2e8f0 !important; color: #0f172a !important; }
        body.light-mode .text-sub { color: #64748b !important; }
        body.light-mode input { background-color: #f1f5f9 !important; color: #0f172a !important; border-color: #cbd5e1 !important; }
        body.light-mode .cat-pill { background-color: #ffffff !important; border-color: #cbd5e1 !important; color: #475569 !important; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- شاشة الترحيب -->
    <div id="welcome-screen" class="fixed inset-0 bg-[#0b0f19] z-50 flex flex-col items-center justify-center p-6 text-center transition-all duration-500">
        <div class="mb-8">
            <h1 id="welcome-title" class="text-4xl sm:text-5xl font-black text-white tracking-widest bg-amber-500/10 border border-amber-500/30 px-8 py-4 rounded-3xl shadow-2xl">سِكّة</h1>
        </div>
        <div class="flex flex-col gap-4 w-full max-w-xs">
            <button onclick="enterApp()" class="flex items-center justify-center gap-3 bg-[#1e293b] hover:bg-[#334155] text-slate-200 font-bold py-4 px-6 rounded-2xl border border-slate-700/60 shadow-lg transition text-base">
                <span>☕</span>
                <span id="welcome-btn-1">صباح الخير</span>
            </button>
            <button onclick="enterApp()" class="flex items-center justify-center gap-3 bg-[#1e293b] hover:bg-[#334155] text-slate-200 font-bold py-4 px-6 rounded-2xl border border-slate-700/60 shadow-lg transition text-base">
                <span id="welcome-arrow">←</span>
                <span id="welcome-btn-2">استكشف القائمة</span>
            </button>
        </div>
    </div>

    <!-- المحتوى الرئيسي للمتجر -->
    <div class="flex-1 flex flex-col max-w-md mx-auto w-full pb-24">
        
        <!-- شريط التنقل العلوي -->
        <header class="sticky top-0 z-40 bg-[#0f172a]/90 backdrop-blur-md px-4 py-3 flex items-center justify-between border-b border-slate-800">
            <!-- أزرار المميزات على اليمين (EN وتغيير الثيم بالشمس) -->
            <div class="flex items-center gap-2">
                <button id="lang-btn" onclick="toggleLang()" class="bg-[#1e293b] card-bg text-slate-300 text-xs font-bold px-3 py-2 rounded-xl border border-slate-700 shadow-sm transition">EN</button>
                <button onclick="toggleTheme()" class="bg-[#1e293b] card-bg text-amber-400 text-xs font-bold p-2 rounded-xl border border-slate-700 shadow-sm transition">☀️</button>
            </div>

            <!-- شريط البحث في الوسط -->
            <div class="flex-1 max-w-[170px] mx-2">
                <div class="relative">
                    <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="البحث..." class="w-full bg-[#1e293b] text-slate-200 text-xs rounded-full py-2 px-3 pr-8 border border-slate-700 focus:outline-none focus:border-amber-500">
                    <span class="absolute right-2.5 top-2 text-slate-400 text-xs">🔍</span>
                </div>
            </div>

            <!-- اسم أو شعار المتجر على اليسار -->
            <div id="brand-title" class="text-lg font-black tracking-wider text-amber-400">سِكّة</div>
        </header>

        <!-- فئات القائمة الدائرية العلوية -->
        <div class="px-4 py-4 overflow-x-auto flex gap-3 scrollbar-none" id="categories-container">
            <button onclick="filterCategory('all')" class="cat-pill active flex flex-col items-center shrink-0 bg-[#1e293b] border border-amber-500 text-white rounded-2xl p-2 w-20 transition" data-cat="all">
                <span class="text-xl mb-1">✨</span>
                <span class="text-[11px] font-bold cat-name">الكل</span>
            </button>
            <button onclick="filterCategory('Bakery')" class="cat-pill flex flex-col items-center shrink-0 bg-[#1e293b] border border-slate-800 text-slate-300 rounded-2xl p-2 w-20 transition" data-cat="Bakery">
                <span class="text-xl mb-1">🥐</span>
                <span class="text-[11px] font-bold cat-name">مخبوزات</span>
            </button>
            <button onclick="filterCategory('Sweets')" class="cat-pill flex flex-col items-center shrink-0 bg-[#1e293b] border border-slate-800 text-slate-300 rounded-2xl p-2 w-20 transition" data-cat="Sweets">
                <span class="text-xl mb-1">🍰</span>
                <span class="text-[11px] font-bold cat-name">حلويات</span>
            </button>
            <button onclick="filterCategory('Matcha')" class="cat-pill flex flex-col items-center shrink-0 bg-[#1e293b] border border-slate-800 text-slate-300 rounded-2xl p-2 w-20 transition" data-cat="Matcha">
                <span class="text-xl mb-1">🍵</span>
                <span class="text-[11px] font-bold cat-name">ماتشا</span>
            </button>
            <button onclick="filterCategory('Coffee')" class="cat-pill flex flex-col items-center shrink-0 bg-[#1e293b] border border-slate-800 text-slate-300 rounded-2xl p-2 w-20 transition" data-cat="Coffee">
                <span class="text-xl mb-1">☕</span>
                <span class="text-[11px] font-bold cat-name">قهوة</span>
            </button>
            <button onclick="filterCategory('Protein')" class="cat-pill flex flex-col items-center shrink-0 bg-[#1e293b] border border-slate-800 text-slate-300 rounded-2xl p-2 w-20 transition" data-cat="Protein">
                <span class="text-xl mb-1">💪</span>
                <span class="text-[11px] font-bold cat-name">بروتين</span>
            </button>
        </div>

        <!-- إجمالي عداد المنتجات -->
        <div class="px-4 mb-2 flex justify-between items-center text-xs text-slate-400 text-sub font-medium">
            <span id="count-text">عدد المنتجات المعروضة:</span>
            <span id="products-count-label" class="bg-[#1e293b] card-bg px-3 py-1 rounded-lg text-amber-400 font-bold">0</span>
        </div>

        <!-- قائمة المنتجات -->
        <main class="px-4 space-y-4" id="products-container">
            <!-- المنتجات -->
        </main>
    </div>

    <!-- نافذة تفاصيل المنتج المنبثقة -->
    <div id="details-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#162032] card-bg w-full max-w-sm rounded-3xl overflow-hidden border border-slate-800 shadow-2xl flex flex-col animate-in fade-in zoom-in duration-200">
            <div class="h-72 relative bg-[#1e293b]">
                <img id="modal-img" src="" alt="" class="w-full h-full object-cover">
                <button onclick="closeDetails()" id="modal-close-icon" class="absolute top-4 left-4 bg-black/60 text-white w-9 h-9 rounded-full flex items-center justify-center font-bold text-lg hover:bg-black transition">&times;</button>
            </div>
            <div class="p-6 flex flex-col gap-3">
                <div>
                    <span id="modal-cat" class="text-xs bg-amber-500/10 text-amber-400 px-3 py-1 rounded-full font-bold"></span>
                    <h2 id="modal-title" class="text-xl font-black text-white mt-2"></h2>
                    <p id="modal-subtitle" class="text-sm text-slate-400 text-sub"></p>
                </div>
                <div class="flex items-center justify-between pt-4 border-t border-slate-800/60 mt-2">
                    <span id="price-label" class="text-sm text-slate-400 text-sub font-medium">السعر:</span>
                    <span id="modal-price" class="text-lg font-black text-amber-400"></span>
                </div>
                <button onclick="closeDetails()" id="modal-close-btn" class="w-full bg-amber-500 text-slate-950 py-3 rounded-2xl font-bold hover:bg-amber-400 transition text-sm mt-4">إغلاق</button>
            </div>
        </div>
    </div>

            { id: 36, nameEn: "Cold Brew", nameAr: "كولد برو", category: "Coffee", price: 22.00, img: "https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=600" },
            { id: 37, nameEn: "Brownie", nameAr: "براوني الشوكولاتة", category: "Bakery", price: 14.00, img: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=600" },
            { id: 38, nameEn: "Pecan Tart", nameAr: "تارت البقان", category: "Sweets", price: 18.00, img: "https://images.unsplash.com/photo-1519869325930-281384150729?w=600" },
            { id: 39, nameEn: "Strawberry Tart", nameAr: "تارت الفراولة", category: "Sweets", price: 16.00, img: "https://images.unsplash.com/photo-1519869325930-281384150729?w=600" },
            { id: 40, nameEn: "Banana Bread", nameAr: "خبز الموز", category: "Bakery", price: 15.00, img: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=600" },
            { id: 41, nameEn: "Matcha Affogato", nameAr: "ماتشا أفوغاتو", category: "Matcha", price: 29.00, img: "https://images.unsplash.com/photo-1536256263959-770b48d82b08?w=600" },
            { id: 42, nameEn: "Rose Matcha", nameAr: "ماتشا الورد", category: "Matcha", price: 28.00, img: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=600" },
            { id: 43, nameEn: "Strawberry Matcha", nameAr: "ماتشا الفراولة", category: "Matcha", price: 28.00, img: "https://images.unsplash.com/photo-1517256064527-09c73fc73e38?w=600" },
            { id: 44, nameEn: "Signature Sikka Shake", nameAr: "شيك سكة الخاص", category: "Protein", price: 30.00, img: "https://images.unsplash.com/photo-1579722820308-d74e57190014?w=600" }
        ];

        let currentCategory = 'all';
        let searchQuery = '';
        let activeModalId = null;

        function enterApp() {
            document.getElementById('welcome-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('welcome-screen').style.display = 'none';
            }, 500);
        }

        function renderProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            const filtered = products.filter(p => {
                const matchesCat = currentCategory === 'all' || p.category === currentCategory;
                const matchesSearch = p.nameEn.toLowerCase().includes(searchQuery.toLowerCase()) || p.nameAr.includes(searchQuery);
                return matchesCat && matchesSearch;
            });

            document.getElementById('products-count-label').innerText = filtered.length;

            if(filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">${currentLang === 'ar' ? 'لا توجد منتجات مطابقة' : 'No matching products'}</div>`;
                return;
            }

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'bg-[#162032] card-bg rounded-3xl overflow-hidden border border-slate-800 shadow-lg flex flex-col mb-4 transition';
                
                const mainTitle = currentLang === 'ar' ? p.nameAr : p.nameEn;
                const subTitle = currentLang === 'ar' ? p.nameEn : p.nameAr;
                const detailsText = currentLang === 'ar' ? 'عرض التفاصيل' : 'View Details';

                card.innerHTML = `
                    <div class="h-64 relative bg-[#1e293b] cursor-pointer group" onclick="showDetails(${p.id})">
                        <img src="${p.img}" alt="${p.nameEn}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=600'">
                        <div class="absolute inset-0 bg-black/10 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                            <span class="bg-black/60 text-white text-xs px-3 py-1.5 rounded-full font-bold">${detailsText}</span>
                        </div>
                    </div>
                    <div class="p-4 flex items-center justify-between">
                        <div>
                            <h3 class="font-bold text-base text-white mb-0.5">${mainTitle}</h3>
                            <p class="text-xs text-slate-400 text-sub font-medium">${subTitle}</p>
                        </div>
                        <div>
                            <span class="text-xs font-black bg-[#1e293b] card-bg text-amber-400 px-3 py-2 rounded-xl border border-slate-700 block">AED ${p.price.toFixed(2)}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-pill').forEach(btn => {
                btn.classList.remove('border-amber-500', 'text-white');
                btn.classList.add('border-slate-800', 'text-slate-300');
            });
            const selected = document.querySelector(`[data-cat="${cat}"]`);
            if(selected) {
                selected.classList.remove('border-slate-800', 'text-slate-300');
                selected.classList.add('border-amber-500', 'text-white');
            }
            renderProducts();
        }

        function handleSearch(val) {
            searchQuery = val;
            renderProducts();
        }

        function showDetails(id) {
            activeModalId = id;
            const p = products.find(item => item.id === id);
            if(!p) return;
            document.getElementById('modal-img').src = p.img;
            document.getElementById('modal-cat').innerText = categoriesMap[p.category][currentLang];
            document.getElementById('modal-title').innerText = currentLang === 'ar' ? p.nameAr : p.nameEn;
            document.getElementById('modal-subtitle').innerText = currentLang === 'ar' ? p.nameEn : p.nameAr;
            document.getElementById('modal-price').innerText = `AED ${p.price.toFixed(2)}`;
            
            document.getElementById('price-label').innerText = currentLang === 'ar' ? 'السعر:' : 'Price:';
            document.getElementById('modal-close-btn').innerText = currentLang === 'ar' ? 'إغلاق' : 'Close';

            document.getElementById('details-modal').classList.remove('hidden');
        }

        function closeDetails() {
            document.getElementById('details-modal').classList.add('hidden');
            activeModalId = null;
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        function toggleLang() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            
            // تغيير اتجاه الصفحة
            const htmlRoot = document.getElementById('html-root');
            htmlRoot.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            htmlRoot.setAttribute('lang', currentLang);

            // تحديث زر اللغة
            document.getElementById('lang-btn').innerText = currentLang === 'ar' ? 'EN' : 'AR';

            // تحديث شاشة الترحيب
            document.getElementById('welcome-title').innerText = currentLang === 'ar' ? 'سِكّة' : 'Sikka';
            document.getElementById('welcome-btn-1').innerText = currentLang === 'ar' ? 'صباح الخير' : 'Good Morning';
            document.getElementById('welcome-btn-2').innerText = currentLang === 'ar' ? 'استكشف القائمة' : 'Explore Menu';
            document.getElementById('welcome-arrow').innerText = currentLang === 'ar' ? '←' : '→';

            // تحديث شريط البحث
            document.getElementById('search-input').placeholder = currentLang === 'ar' ? 'البحث...' : 'Search...';
            document.getElementById('brand-title').innerText = currentLang === 'ar' ? 'سِكّة' : 'Sikka';
            document.getElementById('count-text').innerText = currentLang === 'ar' ? 'عدد المنتجات المعروضة:' : 'Displayed Products:';

            // تحديث أسماء الفئات
            document.querySelectorAll('.cat-pill').forEach(btn => {
                const catKey = btn.getAttribute('data-cat');
                const span = btn.querySelector('.cat-name');
                if(span && categoriesMap[catKey]) {
                    span.innerText = categoriesMap[catKey][currentLang];
                }
            });

            // تحديث المنتجات المعروضة
            renderProducts();

            // تحديث نافذة التفاصيل إن كانت مفتوحة
            if(activeModalId !== null) {
                showDetails(activeModalId);
            }
        }

        renderProducts();
    </script>
</body>
</html>
