<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sikka | سكة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14120e;
    --bg-elev:#1c1a15;
    --cream:#f2ead9;
    --cream-dim:#b8ae9c;
    --navy:#3a5a8c;
    --navy-bright:#5f83bb;
    --gold:#c9a24a;
    --line:#332f27;
    --radius:20px;
  }
  [data-theme="light"]{
    --bg:#f6f1e7;
    --bg-elev:#ffffff;
    --cream:#1c1a15;
    --cream-dim:#6b6252;
    --navy:#2c4a78;
    --navy-bright:#3a5a8c;
    --gold:#a97f22;
    --line:#e3dbc9;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:'Manrope', 'Tajawal', sans-serif;
    min-height:100vh;
    transition:background .3s ease, color .3s ease;
    overflow-x:hidden;
  }
  body[dir="rtl"]{ font-family:'Tajawal','Manrope', sans-serif; }
  .display{ font-family:'Fraunces', serif; }

  /* ---------- Track motif (Sikka = "railway track") ---------- */
  .track{
    height:14px;
    width:100%;
    position:relative;
    opacity:.55;
  }
  .track::before{
    content:"";
    position:absolute;
    top:6px; left:0; right:0; height:2px;
    background:var(--line);
  }
  .track::after{
    content:"";
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    background-image:repeating-linear-gradient(90deg, var(--line) 0 3px, transparent 3px 16px);
  }

  /* ---------- Screens ---------- */
  .screen{ display:none; min-height:100vh; }
  .screen.active{ display:block; }

  /* ---------- Welcome screen ---------- */
  #welcome.active{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:32px; text-align:center; gap:28px;
  }
  .logo-badge{
    width:120px; height:120px; border-radius:50%;
    background:var(--navy);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 3px var(--gold), 0 12px 40px rgba(0,0,0,.35);
  }
  .logo-badge span{
    font-family:'Fraunces', serif;
    font-weight:600; font-size:28px; color:var(--cream);
    letter-spacing:.5px;
  }
  .greeting{
    background:var(--bg-elev);
    border:1px solid var(--line);
    padding:12px 24px; border-radius:999px;
    font-size:14px; color:var(--cream-dim);
  }
  .tagline{
    font-family:'Fraunces', serif;
    font-size:15px; color:var(--cream-dim);
    letter-spacing:.5px;
  }
  .btn-primary{
    background:var(--gold); color:#1c1a15; border:none;
    padding:16px 36px; border-radius:999px;
    font-family:'Manrope', 'Tajawal', sans-serif; font-weight:700; font-size:15px;
    cursor:pointer; display:flex; align-items:center; gap:10px;
    transition:transform .15s ease;
  }
  body[dir="rtl"] .btn-primary{ font-family:'Tajawal', sans-serif; }
  .btn-primary:hover{ transform:translateY(-2px); }
  .btn-primary:active{ transform:translateY(0); }

  /* ---------- Menu screen ---------- */
  #menu{ padding-bottom:60px; }
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--bg); padding:16px 16px 10px;
    display:flex; align-items:center; gap:10px;
  }
  .icon-btn{
    width:42px; height:42px; min-width:42px; border-radius:50%;
    background:var(--bg-elev); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--cream); font-size:16px;
  }
  .search-wrap{
    flex:1; display:flex; align-items:center; gap:8px;
    background:var(--bg-elev); border:1px solid var(--line);
    border-radius:999px; padding:10px 16px;
  }
  .search-wrap input{
    flex:1; background:transparent; border:none; outline:none;
    color:var(--cream); font-size:14px; font-family:inherit;
  }
  .search-wrap input::placeholder{ color:var(--cream-dim); }
  .pill-btn{
    background:var(--bg-elev); border:1px solid var(--line);
    color:var(--cream); border-radius:999px; padding:10px 14px;
    font-size:12px; font-weight:700; cursor:pointer; letter-spacing:.5px;
  }

  .cats{
    display:flex; gap:10px; overflow-x:auto; padding:16px 16px 4px;
    scrollbar-width:none;
  }
  .cats::-webkit-scrollbar{ display:none; }
  .cat-chip{
    display:flex; align-items:center; gap:8px;
    background:var(--bg-elev); border:1px solid var(--line);
    padding:8px 16px 8px 8px; border-radius:999px;
    white-space:nowrap; cursor:pointer; flex-shrink:0;
    font-size:13px; font-weight:700; color:var(--cream-dim);
    transition:all .15s ease;
  }
  body[dir="rtl"] .cat-chip{ padding:8px 8px 8px 16px; }
  .cat-chip.active{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .cat-chip .cat-emoji{
    width:26px; height:26px; border-radius:50%;
    background:rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center; font-size:14px;
  }

  .products{
    display:grid; grid-template-columns:1fr; gap:16px; padding:20px 16px 0;
    max-width:520px; margin:0 auto;
  }
  @media(min-width:640px){
    .products{ grid-template-columns:1fr 1fr; max-width:900px; }
  }
  .card{
    background:var(--bg-elev); border:1px solid var(--line);
    border-radius:var(--radius); overflow:hidden;
    display:flex; flex-direction:column;
  }
  .card-img{
    height:170px; width:100%;
    background:linear-gradient(135deg, var(--navy) 0%, #22314a 100%);
    display:flex; align-items:center; justify-content:center;
    font-size:36px; color:rgba(255,255,255,.5);
  }
  .card-body{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px; }
  .card-tag{
    font-size:11px; text-transform:uppercase; letter-spacing:1px;
    color:var(--gold); font-weight:800;
  }
  .card-name{
    font-family:'Fraunces', serif; font-size:17px; font-weight:600; color:var(--cream);
  }
  .card-row{ display:flex; align-items:center; justify-content:space-between; margin-top:2px; }
  .price-badge{
    background:var(--gold); color:#1c1a15;
    font-weight:800; font-size:13px;
    padding:6px 14px; border-radius:999px;
  }
  .empty-state{
    text-align:center; padding:60px 20px; color:var(--cream-dim);
    grid-column:1/-1;
  }

  /* ---------- Detail screen ---------- */
  .detail-hero{
    width:100%; height:45vh; min-height:280px;
    background:linear-gradient(135deg, var(--navy) 0%, #22314a 100%);
    background-size:cover; background-position:center;
    display:flex; align-items:center; justify-content:center;
    font-size:64px; color:rgba(255,255,255,.5);
  }
  .detail-back{
    position:fixed; top:16px; inset-inline-start:16px; z-index:30;
    background:rgba(20,18,14,.65); backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,.2); color:#fff;
  }
  body[dir="rtl"] .detail-back{ transform:scaleX(-1); }
  .detail-body{
    padding:24px 20px 60px; max-width:560px; margin:0 auto;
  }
  .detail-name{
    font-family:'Fraunces', serif; font-size:26px; font-weight:600; color:var(--cream);
    margin-top:6px;
  }
  .detail-sub{
    color:var(--cream-dim); font-size:14px; margin-top:4px;
  }
  .detail-price{
    display:inline-block; background:var(--gold); color:#1c1a15;
    font-weight:800; font-size:16px; padding:10px 20px; border-radius:999px;
    margin-top:18px;
  }
</style>
</head>
<body dir="rtl" data-theme="dark">

  <!-- SCREEN 1: WELCOME -->
  <section id="welcome" class="screen active">
    <div class="logo-badge"><span>Sikka</span></div>
    <div class="greeting" id="greetingText" style="cursor:pointer;">☕ صباح الخير</div>
    <button class="btn-primary" id="exploreBtn">
      <span id="exploreLabel">استكشف القائمة</span> <span>←</span>
    </button>
    <div class="tagline" id="taglineText">Your Tracks Lead To Sikka</div>
  </section>

  <!-- SCREEN 2: MENU -->
  <section id="menu" class="screen">
    <div class="topbar">
      <div class="icon-btn" id="themeBtn">🌙</div>
      <div class="pill-btn" id="langBtn">EN</div>
      <div class="search-wrap">
        <span style="color:var(--cream-dim); font-size:14px;">🔍</span>
        <input id="searchInput" type="text" placeholder="البحث في القائمة..." oninput="renderProducts()">
      </div>
      <div class="icon-btn" id="homeBtn">⌂</div>
    </div>
    <div class="track"></div>
    <div class="cats" id="catsRow"></div>
    <div class="products" id="productsGrid"></div>
  </section>

  <!-- SCREEN 3: PRODUCT DETAIL -->
  <section id="detail" class="screen">
    <div class="detail-hero" id="detailHero"></div>
    <div class="icon-btn detail-back" id="detailBackBtn">←</div>
    <div class="detail-body">
      <div class="card-tag" id="detailTag"></div>
      <div class="detail-name" id="detailName"></div>
      <div class="detail-sub" id="detailSub"></div>
      <div class="detail-price" id="detailPrice"></div>
    </div>
  </section>
