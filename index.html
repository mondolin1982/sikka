<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة منتجات سكة</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                    }
                }
            }
        }
    </script>
    <style>
        * { border-radius: 8px !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen transition-colors duration-300" id="bodyTag">

    <!-- شاشة الترحيب الرئيسية (الصفحة الافتتاحية) -->
    <div id="welcomeScreen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center p-6 text-center">
        <!-- شعار سكة -->
        <div class="mb-8 p-4 bg-slate-900 border border-slate-800 shadow-xl inline-block">
            <h1 class="text-3xl font-extrabold tracking-widest text-amber-500">سِكَّة</h1>
            <p class="text-xs text-slate-400 mt-1">Sikka Cafe</p>
        </div>

        <!-- أزرار الشاشة الرئيسية -->
        <div class="w-full max-w-xs space-y-4">
            <button onclick="showMorningGreet()" class="w-full bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 py-3 px-6 text-sm font-semibold transition flex items-center justify-center gap-2 shadow-md">
                <span>☕</span> صباح الخير
            </button>
            <button onclick="enterMenu()" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-100 py-3.5 px-6 text-sm font-bold transition flex items-center justify-center gap-2 shadow-lg">
                <span>←</span> استكشف القائمة
            </button>
        </div>
    </div>

    <!-- نافذة رسالة صباح الخير المنبثقة -->
    <div id="morningModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 max-w-sm w-full p-6 text-center relative">
            <h3 class="text-xl font-bold text-amber-400 mb-2">صباح الخير من سكة! ☀️</h3>
            <p class="text-slate-300 text-sm mb-6">نتمنى لك يوماً جميلاً مليئاً بالطاقة والنشاط مع قهوتنا المختصة.</p>
            <button onclick="closeMorningGreet()" class="bg-amber-500 text-slate-950 px-6 py-2 font-bold text-sm">حسناً</button>
        </div>
    </div>

    <!-- المحتوى الرئيسي للقائمة -->
    <div id="mainApp" class="hidden">
        <!-- الهيدر العلوي -->
        <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur border-b border-slate-800 p-4 flex items-center justify-between gap-2 shadow-lg">
            <div class="font-bold text-xl tracking-wider text-amber-500 cursor-pointer" onclick="backToHome()">سِكَّة</div>
            
            <div class="relative flex-1 max-w-md">
                <input type="text" id="searchInput" placeholder="البحث في القائمة..." oninput="filterProducts()" 
                    class="w-full bg-slate-800 text-sm text-slate-200 px-4 py-2 pr-10 border border-slate-700 focus:outline-none focus:border-amber-500">
                <span class="absolute right-3 top-2.5 text-slate-400">🔍</span>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="toggleLang()" id="langBtn" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 text-sm font-semibold border border-slate-700 transition">EN</button>
                <button onclick="toggleTheme()" id="themeBtn" class="bg-slate-800 hover:bg-slate-700 p-2 border border-slate-700 transition">☀️</button>
            </div>
        </header>

        <!-- شريط الفلاتر والأقسام -->
        <nav class="p-4 flex gap-3 overflow-x-auto border-b border-slate-900 bg-slate-950 items-center justify-between">
            <div class="flex gap-3 overflow-x-auto">
                <button onclick="filterCategory('all')" class="cat-btn bg-amber-500 text-slate-950 px-4 py-2 text-sm font-bold whitespace-nowrap transition">الكل</button>
                <button onclick="filterCategory('Sweets')" class="cat-btn bg-slate-900 text-slate-300 hover:bg-slate-800 px-4 py-2 text-sm font-bold whitespace-nowrap border border-slate-800 transition">🍰 حلويات</button>
                <button onclick="filterCategory('Breakfast')" class="cat-btn bg-slate-900 text-slate-300 hover:bg-slate-800 px-4 py-2 text-sm font-bold whitespace-nowrap border border-slate-800 transition">🥐 فطور</button>
                <button onclick="filterCategory('Specialty Coffee')" class="cat-btn bg-slate-900 text-slate-300 hover:bg-slate-800 px-4 py-2 text-sm font-bold whitespace-nowrap border border-slate-800 transition">☕ قهوة مختصة</button>
                <button onclick="filterCategory('Signature Coffee')" class="cat-btn bg-slate-900 text-slate-300 hover:bg-slate-800 px-4 py-2 text-sm font-bold whitespace-nowrap border border-slate-800 transition">🌟 قهوة مميزة</button>
                <button onclick="filterCategory('Matcha')" class="cat-btn bg-slate-900 text-slate-300 hover:bg-slate-800 px-4 py-2 text-sm font-bold whitespace-nowrap border border-slate-800 transition">🍵 ماتشا</button>
                <button onclick="filterCategory('Non-Coffee Drinks')" class="cat-btn bg-slate-900 text-slate-300 hover:bg-slate-800 px-4 py-2 text-sm font-bold whitespace-nowrap border border-slate-800 transition">🥤 مشروبات أخرى</button>
            </div>
        </nav>

        <!-- شبكة المنتجات -->
        <main class="p-4 max-w-7xl mx-auto">
            <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- تعبئة ديناميكية -->
            </div>
        </main>
    </div>

    <!-- نافذة تفاصيل المنتج -->
    <div id="productModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 max-w-lg w-full p-6 relative">
            <button onclick="closeModal()" class="absolute top-3 left-3 text-slate-400 hover:text-white text-xl font-bold">✕</button>
            
            <div class="w-full h-64 overflow-hidden mb-4 border border-slate-800 bg-slate-800 flex items-center justify-center">
                <img id="modalImg" src="" alt="" class="w-full h-full object-cover">
            </div>

            <h2 id="modalTitle" class="text-2xl font-bold text-amber-400 mb-2"></h2>
            <p id="modalDesc" class="text-slate-300 text-sm mb-4 leading-relaxed"></p>
            
            <div class="flex justify-between items-center mt-4 pt-4 border-t border-slate-800">
                <span id="modalPrice" class="text-lg font-bold text-emerald-400"></span>
                <button onclick="closeModal()" class="bg-amber-500 text-slate-950 px-5 py-2 font-bold text-sm">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- سكربت التشغيل وعرض المنتجات بالصور -->
    <script>
        const products = [
            { id: 1, name: "بودنج المانجو", enName: "Mango Pudding", category: "Sweets", price: 25.00, image: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&auto=format&fit=crop&q=60", description: "بودنج مانجو منعش ومحضر بطريقة استوائية فريدة." },
            { id: 2, name: "أرز المانجو اللزج", enName: "Mango Sticky Rice Bowl", category: "Sweets", price: 28.00, image: "https://images.unsplash.com/photo-1563245372-f21724e3856d?w=500&auto=format&fit=crop&q=60", description: "الحلا الآسيوي الكلاسيكي المكون من الأرز والمانجو الطازج." },
            { id: 3, name: "وعاء الآساي", enName: "Açaí Bowl", category: "Sweets", price: 36.00, image: "https://images.unsplash.com/photo-1590301157890-4810ed352733?w=500&auto=format&fit=crop&q=60", description: "وعاء صحي ومنعش من الآساي مع الفواكه الطازجة والجرانولا." },
            { id: 4, name: "كوكيز شوكلت شيبس", enName: "Chocolate Chip Cookie", category: "Sweets", price: 22.00, image: "https://images.unsplash.com/photo-1499636136210-6f4ee915583e?w=500&auto=format&fit=crop&q=60", description: "كوكيز طازجة ودافئة بحبيبات الشوكولاتة الفاخرة." },
            { id: 5, name: "كوكيز مع آيس كريم", enName: "Cookie with Ice Cream", category: "Sweets", price: 28.00, image: "https://images.unsplash.com/photo-1587314168485-3236d6710814?w=500&auto=format&fit=crop&q=60", description: "كوكيز طرية مغطاة بكرة آيس كريم غنية." },
            { id: 6, name: "كعكة التيراميسو", enName: "Tiramisu Cake", category: "Sweets", price: 28.00, image: "https://images.unsplash.com/photo-1571115177098-24ec42ed204d?w=500&auto=format&fit=crop&q=60", description: "كعكة تيراميسو إيطالية أصلية ومميزة." },

            { id: 7, name: "كرواسون سادة", enName: "Plain Croissant", category: "Breakfast", price: 16.00, image: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=500&auto=format&fit=crop&q=60", description: "كرواسون فرنسي كلاسيكي هش ومقرمش بطبقات الزبدة." },
            { id: 8, name: "كرواسون بابيون", enName: "Pappion Croissant", category: "Breakfast", price: 18.00, image: "https://images.unsplash.com/photo-1623341214825-9f4f963727da?w=500&auto=format&fit=crop&q=60", description: "كرواسون بتصميم فراشة فريد ومقرمش." },
            { id: 9, name: "كرواسون بالجبن", enName: "Cheese Croissant", category: "Breakfast", price: 19.00, image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=500&auto=format&fit=crop&q=60", description: "كرواسون غني ومزين بالجبن المذاب." },
            { id: 10, name: "كرواسون الطماطم الصيفية", enName: "Summer Tomato Croissant", category: "Breakfast", price: 22.00, image: "https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?w=500&auto=format&fit=crop&q=60", description: "مخبوزات مالحة ومبتكرة بطماطم الكرز الطازجة." },
            { id: 11, name: "فطيرة الجبن والزعتر", enName: "Thyme & Cheese Pastry", category: "Breakfast", price: 21.00, image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500&auto=format&fit=crop&q=60", description: "فطيرة مربعة محشوة بالجبن الأبيض ورشات الزعتر." },

            { id: 12, name: "لاتيه / كابتشينو ساخن", enName: "Hot Latte / Cappuccino", category: "Specialty Coffee", price: 19.00, image: "https://images.unsplash.com/photo-1534778101976-62847782c213?w=500&auto=format&fit=crop&q=60", description: "إسبريسو غني مع حليب مخفوق ناعم." },
            { id: 13, name: "آيسد سبانيش لاتيه", enName: "Iced Spanish Latte", category: "Specialty Coffee", price: 26.00, image: "https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=500&auto=format&fit=crop&q=60", description: "مشروب بارد ومنعش بطبقات الحليب والإسبريسو." },
            { id: 14, name: "آيس كوفي كلاسيكي", enName: "Classic Iced Coffee", category: "Specialty Coffee", price: 24.00, image: "https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=500&auto=format&fit=crop&q=60", description: "قهوة باردة ومثلجة محضرة من أجود حبوب القهوة." },

            { id: 15, name: "آيسد إكس.أو. قهوة", enName: "Iced X.O. Coffee", category: "Signature Coffee", price: 26.00, image: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500&auto=format&fit=crop&q=60", description: "مشروب سكة المميز والبارد بنكهة خاصة." },
            { id: 16, name: "فروستي فرابي", enName: "Frosty Frappe", category: "Signature Coffee", price: 28.00, image: "https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=500&auto=format&fit=crop&q=60", description: "مشروب فرابي مثلج ومنعش." },

            { id: 17, name: "ماتشا لاتيه مثلج", enName: "Iced Matcha Latte", category: "Matcha", price: 28.00, image: "https://images.unsplash.com/photo-1536256263959-770b48d82b0a?w=500&auto=format&fit=crop&q=60", description: "ماتشا يابانية أصلية باردة مع الحليب والثلج." },
            { id: 18, name: "ماتشا مع طبقة المانجو", enName: "Mango Matcha Fusion", category: "Matcha", price: 30.00, image: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=500&auto=format&fit=crop&q=60", description: "مزيج مبتكر يجمع بين حلاوة المانجو والماتشا." },

            { id: 19, name: "بروتين شيك (واي بروتين)", enName: "Protein Shake", category: "Non-Coffee Drinks", price: 35.00, image: "https://images.unsplash.com/photo-1577805947697-89e18249d767?w=500&auto=format&fit=crop&q=60", description: "مشروب بروتين صحي عالي الجودة." },
            { id: 20, name: "آيس تي الكركديه", enName: "Hibiscus Iced Tea", category: "Non-Coffee Drinks", price: 25.00, image: "https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=500&auto=format&fit=crop&q=60", description: "شاي الكركديه البارد والمنعش." }
        ];

        let currentLang = 'ar';
        let currentCategory = 'all';

        function enterMenu() {
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            renderProducts(products);
        }

        function backToHome() {
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('welcomeScreen').classList.remove('hidden');
        }

        function showMorningGreet() {
            document.getElementById('morningModal').classList.remove('hidden');
        }

        function closeMorningGreet() {
            document.getElementById('morningModal').classList.add('hidden');
        }

        function renderProducts(items) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            if(items.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-10">لا توجد منتجات مطابقة للبحث</p>`;
                return;
            }

            items.forEach(product => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 overflow-hidden cursor-pointer hover:border-amber-500/50 transition duration-200 group shadow-md";
                card.onclick = () => openModal(product);
                
                card.innerHTML = `
                    <div class="overflow-hidden h-48 bg-slate-800 relative flex items-center justify-center">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                    </div>
                    <div class="p-4 text-center">
                        <h3 class="font-bold text-slate-200 mb-1">${currentLang === 'ar' ? product.name : product.enName}</h3>
                        <div class="inline-block bg-slate-800 text-amber-400 px-3 py-1 text-sm font-semibold border border-slate-700 mt-2">
                            AED ${product.price.toFixed(2)}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-amber-500', 'text-slate-950');
                btn.classList.add('bg-slate-900', 'text-slate-300');
            });
            event.target.classList.remove('bg-slate-900', 'text-slate-300');
            event.target.classList.add('bg-amber-500', 'text-slate-950');

            applyFilters();
        }

        function filterProducts() {
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => {
                const matchesCat = currentCategory === 'all' || p.category === currentCategory;
                const matchesSearch = p.name.toLowerCase().includes(query) || p.enName.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });
            renderProducts(filtered);
        }

        function openModal(product) {
            document.getElementById('modalImg').src = product.image;
            document.getElementById('modalTitle').innerText = currentLang === 'ar' ? product.name : product.enName;
            document.getElementById('modalDesc').innerText = product.description;
            document.getElementById('modalPrice').innerText = `AED ${product.price.toFixed(2)}`;
            document.getElementById('productModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        function toggleLang() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'EN' : 'AR';
            document.documentElement.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            document.documentElement.setAttribute('lang', currentLang);
            applyFilters();
        }

        function toggleTheme() {
            const body = document.getElementById('bodyTag');
            const themeBtn = document.getElementById('themeBtn');
            if(body.classList.contains('bg-slate-950')) {
                body.classList.remove('bg-slate-950', 'text-slate-100');
                body.classList.add('bg-slate-100', 'text-slate-900');
                themeBtn.innerText = '🌙';
            } else {
                body.classList.remove('bg-slate-100', 'text-slate-900');
                body.classList.add('bg-slate-950', 'text-slate-100');
                themeBtn.innerText = '☀️';
            }
        }
    </script>
</body>
</html>
